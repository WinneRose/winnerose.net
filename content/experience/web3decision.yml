details: As a fullstack developer and interface designer for a Web3-focused project, I was responsible for creating modern, responsive UIs using Figma and implementing them with technologies like React, Next.js, Tailwind CSS, and Framer Motion. My work included integrating animations with GSAP, building a smooth user experience, and ensuring design consistency across the platform. I collaborated effectively in a remote team environment and contributed to both the main site and its audit portal. web3decision.com, audit.web3decision.com