title: Tunga UAV Team – Aviation and Space Club, Bartın University
role: Interface Developer / Club Member
location: Bartın, Turkey
location-code: tr
date: 2024–2025
details: As part of the Tunga UAV Team under the Aviation and Space Club at Bartın University, I contributed to the interface unit responsible for designing and developing systems that support drone operations. My tasks included building intuitive dashboards and control panels for monitoring UAV telemetry and mission parameters. I collaborated with team members across engineering and design to improve usability and technical efficiency in competitive drone missions.
