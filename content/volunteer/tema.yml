title: TEMA Foundation – Bartın Genç TEMA
role: Social Media Coordinator
location: Bartın, Turkey
location-code: tr
date: 2024-2025
website: https://www.tema.org.tr
details: At Bartın Genç TEMA, a youth initiative of the TEMA Foundation focused on environmental awareness, I actively contributed in social media management and video editing. I created visual content to raise local environmental awareness and help reach broader audiences. One of the key projects I participated in was the “Before It Burns” forest fire education and awareness program held in Amasra.
